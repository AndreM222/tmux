# Display lazygit
bind -r g display-popup -d '#{pane_current_path}' -w80% -h80% -E lazygit

# Display lazydocker
bind -r ` display-popup -d '#{pane_current_path}' -w80% -h80% -E lazydocker

# Make new session and keep in choose-tree
bind -T root c if -F "#{==:#{pane_mode},tree-mode}" "new-session -c '#{pane_current_path}' ; choose-tree -s" "send c"

# Rename session
bind -T root R if -F "#{==:#{pane_mode},tree-mode}" "command-prompt 'rename-session -t '%%''" "send R"
