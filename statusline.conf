# Style
set-option -g status-fg cyan
set -g window-style fg=colour245,bg=default
set -g window-active-style fg=white,bg=default

# pane number display
set-option -g display-panes-active-colour colour208 #orange
set-option -g display-panes-colour colour68 #bg

# clock
set-window-option -g clock-mode-colour colour68 #bg

# allow the title bar to adapt to whatever host you connect to
set -g set-titles on
set -g set-titles-string "#T"

# vim: ft=tmux
set -g mode-style "fg=colour68,bg=colour235,nobold"

# message text
set -g message-style fg=colour208 #orange,bg=black
set -g message-command-style fg=colour208 #orange,bg=black

# pane border
set -g pane-border-style fg=colour60 #bg
set -g pane-active-border-style fg=colour208 #orange

set -g status on
set -g status-interval 1
set -g status-justify left

# default statusbar colors
set -g status-bg default
set -g status-style fg=colour238,bg=default

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=colour236,bg=default,nobold]#[fg=colour68,bg=colour236,nobold]󰧾 #S #[fg=colour236,bg=colour68,nobold,nounderscore,noitalics]#[fg=colour233,bg=colour68,nobold]  #(whoami) #[fg=colour68,bg=default]"
set -g status-right "#[fg=colour238,bg=default,nobold,nounderscore,noitalics]#[fg=colour68,bg=colour238]#[fg=colour236,bg=colour238,nobold,nounderscore,noitalics]#[fg=colour68,bg=colour236]#[fg=colour68,bg=colour236,nobold,nounderscore,noitalics]#[fg=colour233,bg=colour68,nobold] #h #(sh "$HOME/.config/tmux/components/hostStatus.sh")#[fg=colour68,bg=default,nobold]"

# active window title colors
setw -g window-status-current-style fg=default,bg=default
setw -g window-status-activity-style "underscore,fg=colour68,bg=colour235"
setw -g window-status-separator ""
setw -g window-status-style fg=default,bg=default
setw -g window-status-format '#[fg=colour235,bg=default]#[NONE,fg=colour68,bg=colour235] #I  #{b:pane_current_path} #[fg=colour235,bg=default,nobold,nounderscore,noitalics]'
setw -g window-status-current-format '#[fg=colour60,bg=default]#[fg=black,bg=colour60] #I #[fg=colour60,bg=blue] #[fg=black,bg=blue]#{b:pane_current_path} #[fg=blue,bg=default,nobold]'
